<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA / iPhone -->
    <meta name="theme-color" content="#09090B" />
    <!-- Theme before first paint (no light flash): internal CRM = obsidian dark;
         public client pages (/w/ weight logging, /food/ food bank) = light brand -->
    <script>
      (function () {
        var p = location.pathname;
        var isPublic = p.indexOf('/w/') === 0 || p.indexOf('/food/') === 0;
        document.documentElement.setAttribute('data-theme', isPublic ? 'light' : 'dark');
        if (isPublic) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fcf4f9');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="תזונה CRM" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>ניהול לקוחות — תזונה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
